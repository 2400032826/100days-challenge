<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#070913" />

  <!-- Outer Neon Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#bgGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Glass Card Shape -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />

  <!-- Floating Glow Orb -->
  <circle cx="256" cy="220" r="90" fill="url(#bgGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- Center Download Glyph -->
  <g transform="translate(146, 136)" stroke="url(#bgGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow Stem & Head -->
    <path d="M 110 30 L 110 145" />
    <path d="M 65 105 L 110 150 L 155 105" />
    <!-- Tray Bottom -->
    <path d="M 35 160 L 35 190 Q 35 210 55 210 L 165 210 Q 185 210 185 190 L 185 160" />
  </g>

  <!-- Accent Sparkles -->
  <circle cx="130" cy="140" r="8" fill="#06b6d4" />
  <circle cx="380" cy="340" r="6" fill="#ec4899" />
  <circle cx="370" cy="150" r="10" fill="#8b5cf6" opacity="0.8" />
</svg>
